server {
    listen       ${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # index.html NUNCA é cacheado: garante que o navegador sempre baixe a versão
    # publicada mais recente (que referencia os assets novos). Sem isto, um
    # navegador que guardou o index.html antigo continua rodando o código velho.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets têm hash no nome (mudam a cada build) → podem ser cacheados pra sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
