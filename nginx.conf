server {
    listen       ${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: qualquer rota cai no index.html (React Router resolve no cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para os assets versionados do Vite (nomes com hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
